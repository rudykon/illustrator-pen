name: Bootstrap complete Cell-lct Local source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified source archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/cell-lct-local.b64
          for sha in \
            31f46a3e90ce468457db4cbea8576111cab727d3 \
            38902afc0742cfb185fd7bb99485d8450c8b58ab \
            d2bf3c31c8bd66f86b1bc933d05e205f995069be \
            138fadcbb711c2f6d636b6e79e703746385815e2 \
            02b69b52cb56998760be3476f251a05d81b1d473 \
            0070f02d174dc7b64c70adc938642918383e99eb \
            3d8dc18a88a03e43f2a208c107caecc43a40e772
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' \
              | base64 -d >> /tmp/cell-lct-local.b64
          done
          base64 -d /tmp/cell-lct-local.b64 > /tmp/cell-lct-local.tar.xz
          echo 'e61ea0b8a08506d2a2406d7db70c06e330ccb55bdc8d8311b49b2c3f806284c2  /tmp/cell-lct-local.tar.xz' | sha256sum -c -
          mkdir -p /tmp/cell-lct-local
          tar -xJf /tmp/cell-lct-local.tar.xz -C /tmp/cell-lct-local
          rsync -a /tmp/cell-lct-local/cell-lct-local-v0.1.0/ ./
          python tools/verify_manifest.py --root . --manifest BUILD_MANIFEST.json
      - name: Commit complete project and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .upload-verification
          rm -f .github/workflows/test-write.yml
          rm -f .github/workflows/bootstrap-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish Cell-lct Local v0.1.0'
          git push
