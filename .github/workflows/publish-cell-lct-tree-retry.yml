name: Publish validated Cell-lct Local tree (retry)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-cell-lct-tree-retry.yml

permissions:
  contents: write

concurrency:
  group: publish-cell-lct-local-tree
  cancel-in-progress: false

jobs:
  publish-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Atomically promote validated project tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_COMMIT: ${{ github.sha }}
          VALIDATED_TREE: 449f06cf07b84062baf78a030be32c6263bcd8fd
        shell: bash
        run: |
          set -euo pipefail

          api() {
            local method="$1"
            local url="$2"
            local data="${3:-}"
            local attempt
            for attempt in 1 2 3 4 5; do
              if [ -n "$data" ]; then
                response=$(curl --fail-with-body --silent --show-error \
                  --request "$method" \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header "Accept: application/vnd.github+json" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "$url" --data "$data") && { printf '%s' "$response"; return 0; }
              else
                response=$(curl --fail-with-body --silent --show-error \
                  --request "$method" \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header "Accept: application/vnd.github+json" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "$url") && { printf '%s' "$response"; return 0; }
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          tree_response=$(api GET "https://api.github.com/repos/$REPOSITORY/git/trees/$VALIDATED_TREE")
          test "$(jq -er '.sha' <<<"$tree_response")" = "$VALIDATED_TREE"

          commit_payload=$(jq -n \
            --arg message "feat: publish local-first Illustrator vector reconstruction" \
            --arg tree "$VALIDATED_TREE" \
            --arg parent "$CURRENT_COMMIT" \
            '{message: $message, tree: $tree, parents: [$parent]}')
          commit_response=$(api POST "https://api.github.com/repos/$REPOSITORY/git/commits" "$commit_payload")
          new_commit=$(jq -er '.sha' <<<"$commit_response")
          test "$(jq -er '.tree.sha' <<<"$commit_response")" = "$VALIDATED_TREE"

          ref_payload=$(jq -n --arg sha "$new_commit" '{sha: $sha, force: false}')
          ref_response=$(api PATCH "https://api.github.com/repos/$REPOSITORY/git/refs/heads/main" "$ref_payload")
          test "$(jq -er '.object.sha' <<<"$ref_response")" = "$new_commit"

          final_commit=$(api GET "https://api.github.com/repos/$REPOSITORY/commits/main")
          test "$(jq -er '.sha' <<<"$final_commit")" = "$new_commit"
          test "$(jq -er '.commit.tree.sha' <<<"$final_commit")" = "$VALIDATED_TREE"

          echo "Published commit $new_commit with exact tree $VALIDATED_TREE"
